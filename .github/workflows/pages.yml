name: Test, build and deploy the ITR demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test safety and workflow rules
        run: python -m unittest discover -s tests -v
      - name: Generate dashboard data
        run: python scripts/run_pipeline.py --config config.example.json
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itr-demo-run-artifacts
          path: artifacts/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
